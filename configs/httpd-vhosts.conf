# Virtual Hosts
#
# Required modules: mod_log_config
<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>


<VirtualHost *:8081>
    DocumentRoot "D:/Gitlab/OnlinePaymnet_php/zarinpal"
    ServerName zarinpal.local
    <Directory "D:/Gitlab/OnlinePaymnet_php/zarinpal">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
